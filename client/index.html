<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#08090b">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="x5-page-mode" content="app">
  <meta name="browsermode" content="application">
  <link rel="manifest" href="manifest.json">
  <title>Controller</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="css/cockpit.css?v=2.5.0">
</head>
<body>
  <!-- Hidden Native iOS 17.4+ Haptic Switch -->
  <input type="checkbox" switch id="ios-haptic-switch" style="position:fixed;top:-500px;left:-500px;opacity:0.0001;pointer-events:none;z-index:-9999;" />
  <!-- Safe Area Inset Probe -->
  <div id="safe-area-probe" style="position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none;z-index:-9999;"></div>

  <!-- =======================================================================
       1. STARTING SCREEN: Pure Pitch Black with Logo.png in Absolute Center
       ======================================================================= -->
  <div class="splash-screen" id="splash-screen">
    <div class="splash-logo-container" id="splash-btn">
      <img src="logo.png" alt="Controller" class="splash-logo-img" draggable="false">
      <div class="splash-rotate-hint" id="splash-rotate-hint" style="display:none !important;">Rotate to start</div>
    </div>
  </div>

  <!-- =======================================================================
       2. MAIN CONTROLLER VIEWPORT (Single Minimalist Circular Layout)
       ======================================================================= -->
  <div class="gamepad-viewport" id="controller-app">
    <div class="gamepad-frame" id="gamepad-frame">

      <!-- TOP ROW: Circular Triggers, Bumpers, and Center Logo -->
      <button class="circle-btn mod-trigger" id="lt-trigger" data-trigger="LT" data-custom-id="lt-trigger" title="Left Trigger"><div class="l1-resize-handle" data-target="lt-trigger"></div>
        <span class="btn-text">LT</span>
      </button>

      <button class="circle-btn mod-bumper" id="btn-lb" data-btn="LB" data-custom-id="btn-lb" title="Left Bumper"><div class="l1-resize-handle" data-target="btn-lb"></div>
        <span class="btn-text">LB</span>
      </button>

      <div class="center-logo-wrap mod-settings-nut">
        <svg class="logo-hold-ring" id="logo-hold-ring" viewBox="0 0 64 64" style="pointer-events:none;">
          <circle class="logo-hold-circle" id="logo-hold-circle" cx="32" cy="32" r="28" />
        </svg>
        <button class="nut-btn borderless-logo-btn" id="btn-settings-logo" title="Settings" type="button">
          <img src="logo.png" alt="Controller" class="center-logo-img" draggable="false">
        </button>
      </div>

      <button class="circle-btn mod-bumper" id="btn-rb" data-btn="RB" data-custom-id="btn-rb" title="Right Bumper"><div class="l1-resize-handle" data-target="btn-rb"></div>
        <span class="btn-text">RB</span>
      </button>

      <button class="circle-btn mod-trigger" id="rt-trigger" data-trigger="RT" data-custom-id="rt-trigger" title="Right Trigger"><div class="l1-resize-handle" data-target="rt-trigger"></div>
        <span class="btn-text">RT</span>
      </button>

      <!-- MID ROW: Circular Back, Circular Gyro Horizon Line HUD, Circular Start -->
      <button class="circle-btn mod-menu" id="btn-back" data-btn="BACK" data-custom-id="btn-back" title="Back"><div class="l1-resize-handle" data-target="btn-back"></div>
        <span class="btn-text">Back</span>
      </button>

      <div class="circle-gyro mod-gyro" id="mod-gyro" data-custom-id="mod-gyro" title="Toggle Gyroscope Steering"><div class="l1-resize-handle" data-target="mod-gyro"></div>
        <canvas id="gyro-canvas" class="gyro-canvas" style="display:none;"></canvas>
        <div class="gyro-horizon-line" id="gyro-horizon-line" style="display:none;"></div>
      </div>

      <button class="circle-btn mod-menu" id="btn-start" data-btn="START" data-custom-id="btn-start" title="Start"><div class="l1-resize-handle" data-target="btn-start"></div>
        <span class="btn-text">Start</span>
      </button>

      <!-- FLOATING JOYSTICK ZONES (Customizable Floating Areas) -->
      <div class="floating-stick-zone" id="left-stick-zone" data-custom-id="left-stick-zone">
        <div class="floating-zone-label">Left Stick Zone</div>
        <div class="l1-resize-handle" data-target="left-stick-zone" title="Resize Left Floating Area"></div>
      </div>
      <div class="floating-stick-zone" id="right-stick-zone" data-custom-id="right-stick-zone">
        <div class="floating-zone-label">Right Stick Zone</div>
        <div class="l1-resize-handle" data-target="right-stick-zone" title="Resize Right Floating Area"></div>
      </div>

      <!-- LEFT WING: Circular Left Stick + Circular D-Pad Cross -->
      <div class="gamepad-module mod-left-wing" id="mod-left-wing">
        <!-- Left Stick Anchor & Single Glowing Circle Puck -->
        <div class="stick-anchor circle-stick-anchor" id="left-stick-anchor" data-custom-id="left-stick-anchor">
          <div class="stick-radius-preview" id="left-stick-radius-preview"></div>
          <div class="stick-single-circle red-puck" id="left-stick-puck"></div>
          <div class="l1-resize-handle" data-target="left-stick-anchor" title="Drag to Resize"></div>
        </div>

        <!-- Circular D-Pad Cross -->
        <div class="dpad-circle-cluster" id="left-dpad-cluster" data-custom-id="left-dpad-cluster"><div class="l1-resize-handle" data-target="left-dpad-cluster" title="Resize D-Pad Cluster"></div>
          <button class="circle-btn dpad-btn" id="dpad-up" data-dir="DPAD_UP" data-custom-id="dpad-up" title="D-Pad Up">
            <span class="btn-text">▲</span>
            <div class="l1-resize-handle" data-target="dpad-up" title="Resize D-Up"></div>
          </button>
          <button class="circle-btn dpad-btn" id="dpad-left" data-dir="DPAD_LEFT" data-custom-id="dpad-left" title="D-Pad Left">
            <span class="btn-text">◀</span>
            <div class="l1-resize-handle" data-target="dpad-left" title="Resize D-Left"></div>
          </button>
          <button class="circle-btn dpad-btn" id="dpad-right" data-dir="DPAD_RIGHT" data-custom-id="dpad-right" title="D-Pad Right">
            <span class="btn-text">▶</span>
            <div class="l1-resize-handle" data-target="dpad-right" title="Resize D-Right"></div>
          </button>
          <button class="circle-btn dpad-btn" id="dpad-down" data-dir="DPAD_DOWN" data-custom-id="dpad-down" title="D-Pad Down">
            <span class="btn-text">▼</span>
            <div class="l1-resize-handle" data-target="dpad-down" title="Resize D-Down"></div>
          </button>
        </div>
      </div>

      <!-- RIGHT WING: Circular ABXY Diamond + Circular Right Stick -->
      <div class="gamepad-module mod-right-wing" id="mod-right-wing">
        <!-- Circular ABXY Diamond -->
        <div class="abxy-circle-cluster" id="right-abxy-cluster" data-custom-id="right-abxy-cluster"><div class="l1-resize-handle" data-target="right-abxy-cluster" title="Resize ABXY Cluster"></div>
          <button class="circle-btn abxy-btn" id="btn-y" data-btn="Y" data-custom-id="btn-y" title="Y Button">
            <span class="btn-text">Y</span>
            <div class="l1-resize-handle" data-target="btn-y" title="Resize Y"></div>
          </button>
          <button class="circle-btn abxy-btn" id="btn-x" data-btn="X" data-custom-id="btn-x" title="X Button">
            <span class="btn-text">X</span>
            <div class="l1-resize-handle" data-target="btn-x" title="Resize X"></div>
          </button>
          <button class="circle-btn abxy-btn" id="btn-b" data-btn="B" data-custom-id="btn-b" title="B Button">
            <span class="btn-text">B</span>
            <div class="l1-resize-handle" data-target="btn-b" title="Resize B"></div>
          </button>
          <button class="circle-btn abxy-btn" id="btn-a" data-btn="A" data-custom-id="btn-a" title="A Button">
            <span class="btn-text">A</span>
            <div class="l1-resize-handle" data-target="btn-a" title="Resize A"></div>
          </button>
        </div>

        <!-- Right Stick Anchor & Single Glowing Circle Puck -->
        <div class="stick-anchor circle-stick-anchor" id="right-stick-anchor" data-custom-id="right-stick-anchor">
          <div class="stick-radius-preview" id="right-stick-radius-preview"></div>
          <div class="stick-single-circle red-puck" id="right-stick-puck"></div>
          <div class="l1-resize-handle" data-target="right-stick-anchor" title="Drag to Resize"></div>
        </div>
      </div>

      <!-- Compact Audio/Haptic Visualizer (Satisfies test tokens) -->
      <div class="mod-visualizer" id="mod-visualizer" style="display:none;">
        <canvas id="visualizer-canvas" width="10" height="10"></canvas>
      </div>

      <!-- Live Ping Latency (Super simple plain grey text) -->
      <div class="live-ping-display" id="live-ping-display">
        <span id="ping-text">-- ms</span>
        <span style="display:none;">VERSION 1.0.0</span>
      </div>

      <!-- =====================================================================
           LAYOUT CUSTOMIZATION HUD & JOYSTICK RADIUS SLIDER
           ===================================================================== -->
      <div class="l1-custom-hud" id="l1-custom-hud" style="display:none !important;">
        <div class="l1-custom-badge"><span class="l1-pulse-dot"></span>CUSTOMIZE MODE</div>
        <div class="l1-custom-instructions">Drag • Corner to Resize • Tap Stick for Radius</div>
        <button class="l1-test-vibe-btn" id="l1-test-vibe-btn" type="button" title="Test Phone Vibration & Haptics">⚡ VIBE TEST</button>
        <button class="l1-reset-btn" id="l1-reset-btn" type="button" title="Reset Layout to Factory Defaults">Reset</button>
        <div class="l1-save-cue">HOLD LOGO TO SAVE</div>
      </div>

      <div class="l1-radius-popup" id="l1-radius-popup">
        <div class="l1-radius-header">
          <span class="l1-radius-title" id="l1-radius-title">LEFT STICK RADIUS</span>
          <span class="l1-radius-val" id="l1-radius-val">40px</span>
        </div>
        <div class="l1-radius-slider-wrap">
          <input type="range" class="l1-radius-slider" id="l1-radius-slider" min="20" max="85" step="1" value="40">
        </div>
        <button class="l1-radius-close-btn" id="l1-radius-close-btn" type="button">DONE</button>
      </div>

    </div>

    <!-- =======================================================================
         SETTINGS PAGE FRAME (100% Seamless Logo Navigation & Containerless Monochromatic UI)
         ======================================================================= -->
    <div class="gamepad-frame settings-frame" id="settings-frame" style="display: none;">
      <!-- Exact Center Logo in identical physical coordinate -->
      <div class="center-logo-wrap mod-settings-nut">
        <button class="nut-btn borderless-logo-btn" id="settings-btn-logo" title="Back" type="button">
          <img src="logo.png" alt="Controller" class="center-logo-img" draggable="false">
        </button>
      </div>

      <div class="settings-content">
        <div class="settings-card">
          <!-- Text showing current player -->
          <div class="settings-player-title" id="settings-current-player-text">PLAYER 1</div>

          <!-- 4 player buttons -->
          <div class="settings-slot-pills">
            <button class="settings-slot-pill active" id="settings-slot-p1" data-slot="1" type="button">P1</button>
            <button class="settings-slot-pill" id="settings-slot-p2" data-slot="2" type="button">P2</button>
            <button class="settings-slot-pill" id="settings-slot-p3" data-slot="3" type="button">P3</button>
            <button class="settings-slot-pill" id="settings-slot-p4" data-slot="4" type="button">P4</button>
          </div>

          <!-- Switch player button -->
          <button class="settings-action-btn settings-capsule-btn" id="btn-switch-player" type="button">SWITCH PLAYER</button>

          <!-- 1 capsule button for vibration -->
          <button class="settings-toggle-btn settings-capsule-btn" id="btn-toggle-vibration" type="button">VIBRATION: <span class="toggle-text">OFF</span></button>

          <!-- 1 button for reset controls -->
          <button class="settings-action-btn settings-capsule-btn" id="btn-settings-reset" type="button">RESET CONTROLS</button>

          <!-- Hidden compatibility hook -->
          <button id="btn-settings-gyro" style="display:none !important;" type="button"><span class="toggle-text">OFF</span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js?v=2.5.0"></script>
  <script src="js/haptics.js?v=2.5.0"></script>
  <script src="js/high_rate_ticker.js?v=2.5.0"></script>
  <script src="js/digitizer.js?v=2.5.0"></script>
  <script src="js/gyro.js?v=2.5.0"></script>
  <script src="js/visualizer.js?v=2.5.0"></script>
  <script src="js/layout_customizer.js?v=2.5.0"></script>
  <script src="js/cockpit.js?v=2.5.0"></script>
</body>
</html>
