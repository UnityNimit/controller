<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Game Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controller" id="controller">
        <!-- ============================================== -->
        <!-- CONTAINERS & STRUCTURAL SHAPES                 -->
        <!-- ============================================== -->
        <img class="lt-lb-containers" id="lt-lb-containers" src="assets/LT_LB_containers.svg" alt="LT and LB Containers">
        <img class="rt-rb-containers" id="rt-rb-containers" src="assets/RT_RB_containers.svg" alt="RT and RB Containers">
        <img class="back-container" id="back-container" src="assets/back_container.svg" alt="Back Button Container">
        <img class="start-container" id="start-container" src="assets/start_container.svg" alt="Start Button Container">
        <img class="touchpad-body" id="touchpad-body" src="assets/touchpad_body.svg" alt="Touchpad Body">
        <img class="touchpad-divider-line" id="touchpad-divider-line" src="assets/touchpad_divider_line.svg" alt="Touchpad Divider Line">

        <!-- ============================================== -->
        <!-- D-PAD / LEFT VERTICAL BUTTONS                  -->
        <!-- ============================================== -->
        <img class="dpad-top" id="dpad-top" src="assets/Rectangle.svg" alt="D-Pad Top Button">
        <img class="dpad-mid" id="dpad-mid" src="assets/rectangle_1.svg" alt="D-Pad Middle Button">
        <img class="dpad-bot" id="dpad-bot" src="assets/rectange_2.svg" alt="D-Pad Bottom Button">

        <!-- ============================================== -->
        <!-- FACE BUTTON CONTAINERS                         -->
        <!-- ============================================== -->
        <img class="x-container" id="x-container" src="assets/X_container.svg" alt="X Button Container">
        <img class="y-container" id="y-container" src="assets/Y_container.svg" alt="Y Button Container">
        <img class="b-container" id="b-container" src="assets/B_container.svg" alt="B Button Container">
        <img class="a-container" id="a-container" src="assets/A_container.svg" alt="A Button Container">

        <!-- ============================================== -->
        <!-- JOYSTICKS                                      -->
        <!-- ============================================== -->
        <img class="left-joystick" id="left-joystick" src="assets/Left_joystick.svg" alt="Left Joystick">
        <img class="right-joystick" id="right-joystick" src="assets/Right_joystick.svg" alt="Right Joystick">

        <!-- ============================================== -->
        <!-- CENTER GAMEPAD ICON & PLAYER INDICATOR         -->
        <!-- ============================================== -->
        <img class="gamepad-icon" id="gamepad-icon" src="assets/Middle_icon.svg" alt="Gamepad Center Icon">
        <img class="p1" id="p1" src="assets/P1.svg" alt="Player 1 Indicator">

        <!-- ============================================== -->
        <!-- TRIGGER & BUMPER LABELS                        -->
        <!-- ============================================== -->
        <img class="lt-label" id="lt-label" src="assets/LT.svg" alt="LT">
        <img class="lb-label" id="lb-label" src="assets/LB.svg" alt="LB">
        <img class="rt-label" id="rt-label" src="assets/RT.svg" alt="RT">
        <img class="rb-label" id="rb-label" src="assets/RB.svg" alt="RB">

        <!-- ============================================== -->
        <!-- BACK & START LABELS                            -->
        <!-- ============================================== -->
        <img class="back-label" id="back-label" src="assets/BACK.svg" alt="BACK">
        <img class="start-label" id="start-label" src="assets/START.svg" alt="START">

        <!-- ============================================== -->
        <!-- FACE BUTTON LABELS                             -->
        <!-- ============================================== -->
        <img class="x-label" id="x-label" src="assets/X.svg" alt="X">
        <img class="y-label" id="y-label" src="assets/Y.svg" alt="Y">
        <img class="b-label" id="b-label" src="assets/B-1.svg" alt="B">
        <img class="a-label" id="a-label" src="assets/A-1.svg" alt="A">
    </div>
</body>
</html>
