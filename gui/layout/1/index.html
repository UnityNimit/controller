<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controller - Layout 1 (Circular Monochromatic)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controller-layout1" id="controller-layout1">
    <div class="gamepad-frame" id="gamepad-frame">

      <!-- TOP ROW: Circular Triggers, Bumpers, and Center Logo -->
      <button class="circle-btn mod-trigger" id="lt-trigger" data-trigger="LT" title="Left Trigger">
        <span class="btn-text">LT</span>
      </button>

      <button class="circle-btn mod-bumper" id="btn-lb" data-btn="LB" title="Left Bumper">
        <span class="btn-text">LB</span>
      </button>

      <div class="center-logo-wrap mod-settings-nut">
        <button class="nut-btn borderless-logo-btn" id="btn-settings-logo" title="Switch to Layout 2">
          <img src="logo.png" alt="Controller" class="center-logo-img">
        </button>
      </div>

      <button class="circle-btn mod-bumper" id="btn-rb" data-btn="RB" title="Right Bumper">
        <span class="btn-text">RB</span>
      </button>

      <button class="circle-btn mod-trigger" id="rt-trigger" data-trigger="RT" title="Right Trigger">
        <span class="btn-text">RT</span>
      </button>

      <!-- MID ROW: Circular Back, Circular Gyro Horizon Line HUD, Circular Start -->
      <button class="circle-btn mod-menu" id="btn-back" data-btn="BACK" title="Back">
        <span class="btn-text">Back</span>
      </button>

      <div class="circle-gyro mod-gyro active" id="mod-gyro" title="Toggle Gyroscope Steering">
        <div class="gyro-horizon-line" id="gyro-horizon-line"></div>
      </div>

      <button class="circle-btn mod-menu" id="btn-start" data-btn="START" title="Start">
        <span class="btn-text">Start</span>
      </button>

      <!-- LEFT WING: Circular Left Stick + Circular D-Pad Cross -->
      <div class="gamepad-module mod-left-wing" id="mod-left-wing">
        <div class="stick-anchor circle-stick-anchor" id="left-stick-anchor">
          <div class="stick-single-circle red-puck" id="left-stick-puck"></div>
        </div>

        <div class="dpad-circle-cluster" id="left-dpad-cluster">
          <button class="circle-btn dpad-btn" id="dpad-up" data-dir="DPAD_UP" title="D-Pad Up">
            <span class="btn-text">▲</span>
          </button>
          <button class="circle-btn dpad-btn" id="dpad-left" data-dir="DPAD_LEFT" title="D-Pad Left">
            <span class="btn-text">◀</span>
          </button>
          <button class="circle-btn dpad-btn" id="dpad-right" data-dir="DPAD_RIGHT" title="D-Pad Right">
            <span class="btn-text">▶</span>
          </button>
          <button class="circle-btn dpad-btn" id="dpad-down" data-dir="DPAD_DOWN" title="D-Pad Down">
            <span class="btn-text">▼</span>
          </button>
        </div>
      </div>

      <!-- RIGHT WING: Circular ABXY Diamond + Circular Right Stick -->
      <div class="gamepad-module mod-right-wing" id="mod-right-wing">
        <div class="abxy-circle-cluster" id="right-abxy-cluster">
          <button class="circle-btn abxy-btn" id="btn-y" data-btn="Y" title="Y Button">
            <span class="btn-text">Y</span>
          </button>
          <button class="circle-btn abxy-btn" id="btn-x" data-btn="X" title="X Button">
            <span class="btn-text">X</span>
          </button>
          <button class="circle-btn abxy-btn" id="btn-b" data-btn="B" title="B Button">
            <span class="btn-text">B</span>
          </button>
          <button class="circle-btn abxy-btn" id="btn-a" data-btn="A" title="A Button">
            <span class="btn-text">A</span>
          </button>
        </div>

        <div class="stick-anchor circle-stick-anchor" id="right-stick-anchor">
          <div class="stick-single-circle red-puck" id="right-stick-puck"></div>
        </div>
      </div>

      <!-- Live Ping Latency -->
      <div class="live-ping-display" id="live-ping-display">
        <span id="ping-text">-- ms</span>
      </div>

    </div>
  </div>
</body>
</html>
